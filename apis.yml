name: Dinii
description: 'Dinii (株式会社ダイニー) is a Tokyo-based restaurant-technology SaaS company, founded
  in June 2018, offering an "All in One Restaurant Cloud" for food-service businesses. Its
  integrated modules span POS register, customer mobile ordering, mobile self-checkout payment,
  customer management/CRM (with LINE integration), staff attendance and scheduling, reservation
  ledger, and management analytics dashboards (daily P&L, labor-cost optimization, QSC monitoring).
  Dinii reports 3,000+ installed locations and 20 million+ end users, with offices in Tokyo, Osaka,
  Sapporo, and Nagoya. It was surfaced as a portfolio company of Bessemer Venture Partners and added
  to the API Evangelist network. Dinii publishes no public developer portal, API documentation, or
  SDKs at this time; this profile captures its identity and public web properties.'
